<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso · ControlConexion</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center;
      justify-content:center; font-family:system-ui,-apple-system,sans-serif;
      background:#0f172a; color:#e2e8f0; padding:16px; }
    .card { background:#1e293b; padding:28px; border-radius:16px; width:100%;
      max-width:340px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
    h1 { font-size:1.2rem; margin:0 0 4px; }
    p { color:#94a3b8; font-size:.85rem; margin:0 0 20px; }
    input { width:100%; padding:14px; font-size:1.4rem; text-align:center;
      letter-spacing:.3em; border:1px solid #334155; border-radius:10px;
      background:#0f172a; color:#e2e8f0; margin-bottom:14px; }
    button { width:100%; padding:14px; font-size:1rem; font-weight:600;
      border:none; border-radius:10px; background:#3b82f6; color:white;
      cursor:pointer; }
    .err { color:#f87171; font-size:.85rem; margin-bottom:12px; text-align:center; }
  </style>
</head>
<body>
  <form class="card" method="post">
    <h1>🔒 ControlConexion</h1>
    <p>Ingresa tu PIN para administrar la red.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="password" name="pin" inputmode="numeric" autocomplete="off"
           placeholder="PIN" autofocus>
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
